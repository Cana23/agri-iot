# Este archivo DEBE estar en la raíz de tu proyecto.
# Define la configuración de tu clúster local de 'kind'.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # Mapea los puertos de tu máquina al clúster para acceder a la app
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  # --- CLAVE PARA LIVE-RELOADING ---
  # Monta tu código del frontend DENTRO del clúster
  extraMounts:
  - hostPath: ./campo-verde-vision # Ruta en tu PC
    containerPath: /local/campo-verde-vision # Ruta disponible dentro del clúster

