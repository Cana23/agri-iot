name: CI/CD Pipeline - Backend (Local Docker)

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image tagged by commit SHA
        run: |
          cd backend
          docker build -t backend:${{ github.sha }} -f Dockerfile .
          docker tag backend:${{ github.sha }} backend:latest

      - name: Start services with docker-compose
        run: |
          docker compose -f docker-compose.yml up -d --build
        env:
          # Variables globales
          SENSOR_API_URL: ${{ secrets.SENSOR_API_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
          FETCH_INTERVAL_MS: ${{ secrets.FETCH_INTERVAL_MS }}

          # service-auth
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AUTH_PORT: ${{ secrets.AUTH_PORT }}

          # service-parcels
          PARCEL_PORT: ${{ secrets.PARCEL_PORT }}

          # service-sensors
          SENSOR_PORT: ${{ secrets.SENSOR_PORT }}
          SENSOR_API: ${{ secrets.SENSOR_API }}

      - name: Wait for health endpoints
        run: |
          for i in {1..12}; do
            echo "Checking health... attempt $i"
            if curl -fsS http://localhost:3002/health && \
               curl -fsS http://localhost:3003/health && \
               curl -fsS http://localhost:3004/health; then
              echo "✅ All services healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Services failed health check"
          exit 1

      - name: Tag as stable if success
        if: success()
        run: |
          docker tag backend:${{ github.sha }} backend:stable
          echo "✅ Deployed as stable."

      - name: Rollback to stable on failure
        if: failure()
        run: |
          echo "Attempting rollback..."
          if docker image inspect backend:stable >/dev/null 2>&1; then
            docker tag backend:stable backend:latest
            docker compose down
            docker compose up -d
            echo "Rollback executed to backend:stable"
          else
            echo "⚠️ No stable image found, stopping services."
            docker compose down
            exit 1
          fi
