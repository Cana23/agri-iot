name: CI/CD Pipeline - Backend (Local Docker)

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (for docker on runner)
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image tagged by commit SHA
        run: |
          cd backend
          docker build -t backend:${{ github.sha }} -f Dockerfile .
          docker tag backend:${{ github.sha }} backend:latest

      - name: Save previous 'stable' image if exists
        run: |
          # If exists, create a local reference
          docker image inspect backend:stable >/dev/null 2>&1 && echo "stable exists" || echo "no stable image"

      - name: Start services with docker-compose
        run: |
          cd ..
          docker compose up -d --build

      - name: Wait for health endpoints (try for 60s)
        run: |
          set -e
          OK=true
          for i in $(seq 1 12); do
            echo "health check attempt $i..."
            curl -fsS http://localhost:3002/health || echo "sensors down"
            curl -fsS http://localhost:3003/health || echo "parcels down"
            curl -fsS http://localhost:3004/health || echo "auth down"
            # Evaluate: require all three to respond
            if curl -fsS http://localhost:3002/health && curl -fsS http://localhost:3003/health && curl -fsS http://localhost:3004/health; then
              echo "All healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Health checks failed"
          exit 1

      - name: On success, tag image as stable
        if: success()
        run: |
          docker tag backend:${{ github.sha }} backend:stable
          echo "Deployed and tagged stable."

      - name: Rollback to stable on failure
        if: failure()
        run: |
          echo "Attempting rollback..."
          # If stable exists, retag it as latest and deploy
          if docker image inspect backend:stable >/dev/null 2>&1; then
            docker tag backend:stable backend:latest
            docker compose down
            docker compose up -d
            echo "Rollback executed to backend:stable"
            exit 0
          else
            echo "No backend:stable found — stopping compose"
            docker compose down
            exit 1
          fi
