# El "portero" de tu aplicación: dirige el tráfico a los servicios correctos.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agri-iot-ingress
  annotations:
    # Esta regla es para que las URLs /api/auth/algo se conviertan en /algo dentro del servicio
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      # Rutas para el backend
      - path: /api/auth(/|$)(.*)
        # --- CORRECCIÓN ---
        # Se cambia a ImplementationSpecific para permitir expresiones regulares.
        pathType: ImplementationSpecific
        backend:
          service:
            name: auth-service
            port:
              number: 3004
      - path: /api/parcels(/|$)(.*)
        # --- CORRECCIÓN ---
        pathType: ImplementationSpecific
        backend:
          service:
            name: parcels-service
            port:
              number: 3003
      - path: /api/sensors(/|$)(.*)
        # --- CORRECCIÓN ---
        pathType: ImplementationSpecific
        backend:
          service:
            name: sensors-service
            port:
              number: 3002
      # Ruta principal para el frontend (esta se queda como está)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service # Apunta a nuestro servicio de frontend
            port:
              number: 8080 # IMPORTANTE: Apunta al puerto de desarrollo 8080

